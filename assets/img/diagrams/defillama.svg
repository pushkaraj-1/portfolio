<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="RPC failover state machine"><defs><marker id="a-93a2b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#93a2b6"/></marker><marker id="a-e11d48" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#e11d48"/></marker><marker id="a-0d9488" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488"/></marker></defs><rect x="0.5" y="0.5" width="899" height="339" rx="14" fill="#fbfcfd" stroke="#e3e8ef"/><text x="26" y="32" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1.0">RPC endpoint resolution and failover</text><text x="26" y="50" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" opacity="1.0">user endpoints win; failing providers are quarantined, not discarded</text><rect x="26" y="96" width="150" height="62" rx="9" fill="#64748b" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="26" y="96" width="150" height="62" rx="9" fill="none" stroke="#64748b" stroke-width="1.1" opacity="0.55"/><text x="101.0" y="131.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">request</text><rect x="216" y="88" width="210" height="78" rx="9" fill="#6366f1" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="216" y="88" width="210" height="78" rx="9" fill="none" stroke="#6366f1" stroke-width="1.1" opacity="0.55"/><text x="321.0" y="124.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">resolve endpoint</text><text x="321.0" y="140.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">user-defined first</text><rect x="466" y="96" width="170" height="62" rx="9" fill="#0d9488" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="466" y="96" width="170" height="62" rx="9" fill="none" stroke="#0d9488" stroke-width="1.1" opacity="0.55"/><text x="551.0" y="124.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">healthy pool</text><text x="551.0" y="140.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">in rotation</text><rect x="704" y="96" width="170" height="62" rx="9" fill="#0d9488" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="704" y="96" width="170" height="62" rx="9" fill="none" stroke="#0d9488" stroke-width="1.1" opacity="0.55"/><text x="789.0" y="131.5" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">response</text><path d="M 176 127 L 212 127" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 426 127 L 462 127" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 636 127 L 700 127" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><text x="321" y="182" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#93a2b6" text-anchor="middle" opacity="1.0">Fixes #162 - defaults no longer override user config</text><rect x="466" y="226" width="170" height="62" rx="9" fill="#e11d48" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="466" y="226" width="170" height="62" rx="9" fill="none" stroke="#e11d48" stroke-width="1.1" opacity="0.55"/><text x="551.0" y="254.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">quarantine</text><text x="551.0" y="270.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">10 min cooldown</text><path d="M 551 158 L 551 204 L 551 204 L 551 226" fill="none" stroke="#e11d48" stroke-width="1.25" marker-end="url(#a-e11d48)" stroke-linecap="round" stroke-linejoin="round"/><text x="551.0" y="198" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">5 failures</text><path d="M 636 257 L 760 257 L 760 164" fill="none" stroke="#0d9488" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#a-0d9488)" stroke-linecap="round" stroke-linejoin="round"/><text x="700" y="249" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">cooldown elapsed -&gt; retry</text><text x="450" y="312" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#93a2b6" text-anchor="middle" opacity="1.0">bounds the blast radius of one bad provider without permanently dropping it</text></svg>