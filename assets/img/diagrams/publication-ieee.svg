 fill="none" stroke="#64748b" stroke-width="1.1" opacity="0.55"/><text x="171.0" y="248.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">rights registry</text><text x="171.0" y="264.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">who owns what share</text><rect x="322" y="220" width="250" height="62" rx="9" fill="#d97706" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="322" y="220" width="250" height="62" rx="9" fill="none" stroke="#d97706" stroke-width="1.1" opacity="0.55"/><text x="447.0" y="248.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">royalty split</text><text x="447.0" y="264.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">deterministic payout</text><rect x="598" y="220" width="256" height="62" rx="9" fill="#0d9488" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="598" y="220" width="256" height="62" rx="9" fill="none" stroke="#0d9488" stroke-width="1.1" opacity="0.55"/><text x="726.0" y="248.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">settlement</text><text x="726.0" y="264.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">per-stream transfer</text><path d="M 296 251 L 318 251" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 572 251 L 594 251" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><path d="M 460 158 L 460 200 L 460 200 L 460 220" fill="none" stroke="#93a2b6" stroke-width="1.25" marker-end="url(#a-93a2b6)" stroke-linecap="round" stroke-linejoin="round"/><text x="450" y="344" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">the intermediary that normally holds and delays payment is removed</text><text x="450" y="368" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#93a2b6" text-anchor="middle" opacity="1.0">settlement becomes a property of playback rather than a quarterly reconciliation</text><rect x="26" y="396" width="848" height="52" rx="10" fill="none" stroke="#e3e8ef" stroke-width="1.25" opacity="1.0"/><text x="46" y="419" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1.0">IEEE ICSCSS 2023</text><text x="46" y="436" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="start" opacity="1.0">P. Baradkar et al.  -  Cited by 7</text></svg>