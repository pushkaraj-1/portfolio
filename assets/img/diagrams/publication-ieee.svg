<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="IEEE NFT music streaming paper figure"><defs><marker id="a-93a2b6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#93a2b6"/></marker></defs><rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="#fbfcfd" stroke="#e3e8ef"/><text x="26" y="32" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1.0">Blockchain-based music streaming with NFTs</text><text x="26" y="50" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="11" font-weight="400" fill="#5b6b7f" text-anchor="start" opacity="1.0">rights encoded on-chain; royalties split automatically at play time</text><rect x="26" y="92" width="180" height="66" rx="9" fill="#6366f1" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="26" y="92" width="180" height="66" rx="9" fill="none" stroke="#6366f1" stroke-width="1.1" opacity="0.55"/><text x="116.0" y="122.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">artist</text><text x="116.0" y="138.0" font-family="'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="400" fill="#5b6b7f" text-anchor="middle" opacity="1.0">mints release</text><rect x="360" y="92" width="200" height="66" rx="9" fill="#8b5cf6" stroke="none" stroke-width="1.25" opacity="0.09"/><rect x="360" y="92" width="200" height="66" rx="9" fill="none" stroke="#8b5cf6" stroke-width="1.1" opacity="0.55"/><text x="460.0" y="122.0" font-family="'Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle" opacity="1.0">NFT</text><text x="460.0" y="138.0" font-family="'SFMono-Regular',Menlo,C